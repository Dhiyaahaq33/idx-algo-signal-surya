name: Daily IDX Signal Run

on:
  schedule:
    # 09:30 UTC = 16:30 WIB, Senin-Jumat (setelah bursa IDX tutup ~16:00 WIB)
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Tanggal analisis (YYYY-MM-DD) - kosongin buat data terbaru"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # signal.log sengaja gak masuk git (lihat .gitignore) - dipertahankan lewat Actions
      # cache antar-run biar view_log.py (streak/watch) tetap punya riwayat, bukan reset tiap run.
      - name: Restore signal.log dari cache run sebelumnya
        uses: actions/cache@v4
        with:
          path: signal.log
          key: signal-log-${{ github.run_id }}
          restore-keys: |
            signal-log-

      - name: Run screening
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
          FONNTE_TARGET: ${{ secrets.FONNTE_TARGET }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python main.py "${{ github.event.inputs.date }}"
          else
            python main.py
          fi

      - name: Export sheet snapshot buat web dashboard
        env:
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python dashboard/export_data.py

      - name: Commit dashboard/data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.json
          git diff --cached --quiet || git commit -m "chore: refresh dashboard data [skip ci]"
          git push

      - name: Build dashboard buat GitHub Pages
        run: |
          python dashboard/build.py --generated-at "$(TZ=Asia/Jakarta date +'%Y-%m-%d %H:%M WIB')"
          mkdir -p public
          cp dashboard/output.html public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    needs: run-screener
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
